[[patch]]
name = "0400-guest-vblank-precise-win32"
source = "local"
path = "patches/sdk/0400-guest-vblank-precise-win32.patch"
sha256 = "d80a2f939a620bd72b5c160cd0ae4548693490bf16da62a1917a7beb38fe78e7"
purpose = "Windows guest vblank (graphics_system.cpp): an absolute grid of 1/video_mode_refresh_rate from a QPC origin, a CREATE_WAITABLE_TIMER_HIGH_RESOLUTION wait to ~0.3 ms before each point then a QPC spin, thread in MMCSS \"Games\" at time-critical while it waits and above-normal while MarkVblank runs the game's interrupt callback, resync (never a burst) when over one period late, `[guest-vblank] period p50=.. p99=.. late=.. resync=.. early=.. n=..` every 10 s. Cvars guest_vblank_precise (true), guest_vblank_spin_us (300). vsync=false keeps the SDK loop and warns once. rexgpu-xenos links avrt. Not built before the first W3 build."
subdir = ""
bucket = "REDO"

[[patch]]
name = "0410-cp-event-seq-export"
source = "local"
path = "patches/sdk/0410-cp-event-seq-export.patch"
sha256 = "a989ca94b7c477874dfbfc5b281da1fe3b50753c916c20f9d194385cabec9311"
purpose = "rexgpu-xenos.dll exports the C data symbol nfsmw_cp_event_seq (std::atomic<uint32_t>); the command processor bumps it and WakeByAddressAll's it after EVENT_WRITE_SHD, MEM_WRITE, a matched COND_WRITE and REG_TO_MEM, for mcla/hooks/mcla_fence_spin.cpp (GetProcAddress + WaitOnAddress). rexgpu-xenos links Synchronization. No cvar. Not built before the first W3 build."
subdir = ""
bucket = "REDO"

[[patch]]
name = "0420-mm-query-allocation-size-from-address"
source = "local"
path = "patches/sdk/0420-mm-query-allocation-size-from-address.patch"
sha256 = "833a8f2d6af9954824ca0c97d3954212dbf623c0eba61816b81ac064630b6416"
purpose = "xboxkrnl MmQueryAllocationSize(address) returns the bytes from the address to the end of its allocation, not the whole allocation's size (root fix of the W9 texclear finding: RAGE's texture create memsets that many bytes from an address inside a bigger block); the allocation's base returns the old value. Cvar mm_query_allocation_size_from_address (true; false = SDK behaviour). Logs the first four calls that differ. Not built before the first W5 build."
subdir = ""
bucket = "REDO"

[[patch]]
name = "0430-cp-wait-vblank-wake"
source = "local"
path = "patches/sdk/0430-cp-wait-vblank-wake.patch"
sha256 = "cc5a7cff57e776de2022d8741821f4d6eedbd23cc25ff5561a1165f438bd85f4"
purpose = "Windows: the command processor's sleeping WAIT_REG_MEM (wait >= 0x100; the title's swap gate, released by the guest's vblank handler) wakes via WaitOnAddress when GraphicsSystem::MarkVblank returns instead of noticing the release at its next 1 ms Sleep tick, which was 0-2 ms late for every swap (presents 33.3 ms +- 2 ms apart, p99 35.1; the M4 gate). The sleep length stays as the time-out. Cvar cp_wait_vblank_wake (true; false = SDK behaviour). Not built before the next SDK build."
subdir = ""
bucket = "REDO"

[[patch]]
name = "0440-guest-vblank-display-lock"
source = "local"
path = "patches/sdk/0440-guest-vblank-display-lock.patch"
sha256 = "bbbae5175551d9a4c8647d0b473e332e3bb44bc60fa36867d1a6f8848ef22ef2"
purpose = "Windows: the guest vblank grid of 0400 takes its phase and rate from the real vblank of the display the game window is on (helper thread on IDXGIOutput::WaitForVBlank, a line fitted to its last 128 vblanks, every k-th vblank when the display refreshes at k x video_mode_refresh_rate within 0.5 %); falls back to the QPC grid. Stats line gains src=display|qpc. Cvars guest_vblank_display_lock (true), guest_vblank_display_offset_us (0). rexgpu-xenos links dxgi. Not built before the next SDK build."
subdir = ""
bucket = "REDO"

[[patch]]
name = "0450-skip-overwritten-transfers-fix"
source = "local"
path = "patches/sdk/0450-skip-overwritten-transfers-fix.patch"
sha256 = "ee8890774971847f29b6b285c6021bc5eb63b4db1d5be66d3b0c47c5f3e63e7a"
purpose = "skip_overwritten_transfers (default stays false): GetOverwrittenRectangle no longer screens a rectangle-list draw out for the guest's cull / polygon mode / polygon offset bits (the host ignores them for a rectangle list: IsPrimitivePolygonal is false), only for user clip planes; every rejection records its reason. Cvars skip_overwritten_transfers_log (why each draw was cut or kept, once per shader pair and outcome, with the registers read, plus a 10 s summary) and skip_overwritten_transfers_poison (fill what isn't transferred with junk to check exactness). Not built before the next SDK build."
subdir = ""
bucket = "REDO"

[[patch]]
name = "0460-batched-stretch-resolve"
source = "local"
path = "patches/sdk/0460-batched-stretch-resolve.patch"
sha256 = "19246dcd6fd0f63b1c6f849db13e30e4b19eee95d32c3e22c219d5228ff13293"
purpose = "D3D12: the direct resolve shaders that read a single-sampled render target through the FSR squeeze's stretch get batched-load variants (resolve_direct_batched_{fast,full}_{32,64}bpp_stretch[_scaled], DXBC built with fxc from the xenia 0b2ffa3 shader tree by build_resolve_shaders.py), picked with resolve_direct_batched_loads; values bit for bit the unbatched ones. Vulkan's stretch resolves stay unbatched (no Vulkan SDK to build SPIR-V). Not built before the next SDK build."
subdir = ""
bucket = "REDO"

[[patch]]
name = "0480-fullscreen-display-mode"
source = "local"
path = "patches/sdk/0480-fullscreen-display-mode.patch"
sha256 = "578e4e81374ae7a677c19a8a6a25c0b9be0369295c27dcc85e183b3124e1e7da"
purpose = "UI: cvar fullscreen_mode (desktop|guest|WxH[@Hz]; default desktop = unchanged borderless). Exclusive fullscreen: SDL switches the display to the guest's size at the highest multiple-of-60 Hz (120 preferred) so the display's scaler fills the panel and the presenter paints guest-size; closest larger mode or desktop fallback, logged. D3D12 presenter logs its swap chain size. Not built before the next SDK build."
subdir = ""
bucket = "REDO"

[[patch]]
name = "0470-fsr4-signed-upscaler"
source = "local"
path = "patches/sdk/0470-fsr4-signed-upscaler.patch"
sha256 = "f2ddb8a3c68c6866c871da51ecb730a0bdf5f1dcd2c90e0430421a353df46a4b"
purpose = "Windows D3D12: AMD's signed FidelityFX 2.4.0 runtime (loader + upscaler, fetched at configure time and pinned by SHA-256; MIT) lets temporal_aa=fsr run FSR 4.1.2 on the Radeon 800M and RDNA 2+, with FSR 3.1.6 fallback inside the runtime and the built FSR 3.1.4 when the DLLs are absent. Cvars temporal_aa_upscaler (auto|fsr3|fsr4), temporal_aa_upscaler_active. No reactive mask with FSR 4. Applied after 0480 (independent). Not built before the next SDK build."
subdir = ""
bucket = "REDO"

