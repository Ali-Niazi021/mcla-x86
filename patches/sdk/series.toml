# series.toml - the ordered SDK patch series (PLAN 3.3). Owner: the SDK slice (W1.1); every SDK change goes through here.
#
# tools/prepare_sdk.py reads this file: `fetch` clones the pinned trees, `apply` verifies each patch file's SHA-256
# against this list and applies the entries in this order (git apply, inside `subdir` when set), `status` compares
# the files with what was recorded at apply time, `build` builds and installs the result.
#
# Entry fields (all always present):
#   name     unique id (also the key of $WORK/sdk/src/.mcla-x86/series.applied)
#   source   "renan": `path` is relative to RenanQueiroz/mcla-recomp at the pinned commit, read from
#            $WORK/prior/renan-mcla-recomp (fetched, never vendored); "local": `path` is relative to this repo
#   path     repo-relative path of the patch file
#   sha256   SHA-256 of the patch file's bytes. After editing a local patch run `python tools/prepare_sdk.py rehash`
#   purpose  one line
#   subdir   directory inside the SDK tree in which `git apply` runs ("" = the SDK root; e.g. "thirdparty/FFmpeg")
#   bucket   PLAN 4.1: AS-IS (taken unchanged), PORT (logic kept, rebased or re-expressed), REDO (new code for Windows)
#
# Renan's entries are his Windows list in the exact order scripts/make_pc.ps1 applies it (75 patches) minus the three
# in [[dropped]]. W0.3 proved the drops apply-independent: the other patches applied with 0 failures without them.
# The local entries follow, rebased on Renan's tree (0 offsets). 0400 and later are the wave-3 Windows patches.

