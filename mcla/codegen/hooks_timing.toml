# MCLA hooks_timing mid-asm hooks (docs/mcla/TIMING.md). Included from mcla_manifest.toml.
# Each hook: own file in games/mcla/hooks/, MCLA_HOOK_<NAME> flag, cvar default OFF until verified.
#
# FLAT schema, only [[midasm_hook]] entries, NO root keys (see mcla_manifest.toml). One entry per guest
# address; none of these is in hooks.toml or hooks_widescreen.toml (tools/mcla/check_codegen_toml.py).
# C++ linkage, global namespace, registers by reference in the listed order:
#     bool mcla_hook_x(PPCRegister& r3, ...)   when a *_on_true key is set
#     void mcla_hook_x(PPCRegister& r3, ...)   otherwise
# MASTER cvar mcla_sim60 (default OFF = the game as shipped: fixed step 1/30 s, 2 physics substeps of
# 1/60 s). Every hook below is a no-op (one cvar read) until it is switched on; with the build flag 0
# the C++ function stays and does nothing, so this file never changes to switch a hook off.
# Sites read from the generated listing with the image words (scratch/ws-timing/gd.py): each address
# lies inside the generated function named in its comment. The registers' roles are in the header of
# each hook file (games/mcla/hooks/mcla_t_*.cpp). The A1 heartbeat (hooks.toml, 0x821BDA90) carries
# the game-thread pacer, the substep reset and the `[mcla-sim]` line.

# [A2] mcla_t_frame_delta: AFTER `subf r8,r10,r11` in rage::sysTimeManager::Update (sub_821BDA90);
# r8 = elapsed guest ticks (signed 64 bit), clamped to 1/8 s; also the quantiser's input (the real
# frame time measured with the host's tick rate). games/mcla/hooks/mcla_t_frame_delta.cpp
[[midasm_hook]]
address = 0x821BDAB0
name = "mcla_hook_frame_delta"
registers = ["r8"]
after_instruction = true

# [T1] mcla_t_sim_step: AFTER `lfs f11,32(r3)` at the head of the timer's fixed-step path (path 2) in
# sub_821BDA90; r3 = the timer, f11 = the step (the shipped 1/30). The hook sets f11 = n/60 and the
# frame-rate object's substep word = n. games/mcla/hooks/mcla_t_sim_step.cpp
[[midasm_hook]]
address = 0x821BDB90
name = "mcla_hook_sim_step"
registers = ["r3", "f11"]
after_instruction = true

# [T2a] mcla_t_camera_pos: BEFORE `addi r9,r1,80` in sub_82320298 (the chase camera), the join of the
# game's two factor branches; f13 = the factor it chose, cr6.lt = (round(1/dt) < 60).
# games/mcla/hooks/mcla_t_camera_pos.cpp
[[midasm_hook]]
address = 0x82320468
name = "mcla_hook_camera_pos"
registers = ["f13", "cr6"]

# [T2b] mcla_t_camera_lookat: BEFORE `li r9,288` in sub_82320298, the join of the second factor's
# branches; f0 = the factor, cr6.lt = (round(1/dt) < 60). games/mcla/hooks/mcla_t_camera_lookat.cpp
[[midasm_hook]]
address = 0x823204F4
name = "mcla_hook_camera_lookat"
registers = ["f0", "cr6"]

# [T3] mcla_t_chassis_depth: BEFORE `lis r11,-32256` in sub_82563298 (chassis ground depth), the join
# of the two alpha constants (0.10 / 0.05); f0 = alpha, cr6.lt = (round(1/dt) < 60) (r11 is already
# overwritten on both paths). games/mcla/hooks/mcla_t_chassis_depth.cpp
[[midasm_hook]]
address = 0x82563720
name = "mcla_hook_chassis_depth"
registers = ["f0", "cr6"]

# [T4] mcla_t_ui_movie_advance: BEFORE `beq cr6,0x825edc78` in sub_825EDC08 (swfCONTEXT update);
# r31 = the context, r25 = the one-frame flag. true = jump to 0x825EDD44, the function's "no movie
# frame is due" exit (clears byte +136, releases the entry lock). games/mcla/hooks/mcla_t_ui_movie_advance.cpp
[[midasm_hook]]
address = 0x825EDC6C
name = "mcla_hook_ui_movie_advance"
registers = ["r31", "r25"]
jump_address_on_true = 0x825EDD44

# [T5] mcla_t_ui_countdown_dt: BEFORE `addi r4,r8,-9924` in sub_82212298; r3 = the HUD movie's
# swfCONTEXT, f1 = the value of the script variable countdownUpdate (the script adds it once per
# movie step). games/mcla/hooks/mcla_t_ui_countdown_dt.cpp
[[midasm_hook]]
address = 0x822124DC
name = "mcla_hook_ui_countdown_dt"
registers = ["r3", "f1"]

# [T6] mcla_t_race_clock: BEFORE `fctiwz f13,f0` in sub_82256220; f0 = the step in ms (float), r31 =
# the race object whose clock [r31+3748] gets the truncated value. games/mcla/hooks/mcla_t_race_clock.cpp
[[midasm_hook]]
address = 0x822562E8
name = "mcla_hook_race_clock"
registers = ["f0", "r31"]

# [A5] mcla_t_present_interval: AFTER `li r11,2` in sub_824199B0 (the Present prelude sub_82419E90 ->
# sub_824199B0 runs before every D3DDevice_Swap); the next instruction is `b 0x82419AB4`, which builds
# the swap-callback argument from r11 (bits 8..11 = vblanks per swap). The shipped 2 locks the guest
# at 30 fps on a 60 Hz vblank (the CP waits in WAIT_REG_MEM [shared+4] == 0 until the target vblank);
# the hook lowers it to 1 for a 60 fps cap. docs/mcla/TIMING.md section 11.
# games/mcla/hooks/mcla_t_present_interval.cpp. NEEDS A RE-CODEGEN (new entry).
[[midasm_hook]]
address = 0x82419AA0
name = "mcla_hook_present_interval"
registers = ["r11"]
after_instruction = true

# [A6a] mcla_t_present_immediate: AFTER `rlwinm r10,r10,9,25,31` (word 554A4E7E) in sub_824199B0, the
# fourth instruction of the join block that starts at the label 0x82419AB4 (A5 sits on one of its arms).
# r10 = the 7-bit D3DRS_PRESENTIMMEDIATETHRESHOLD from [dev+11852] and nothing else (the 64-bit value is
# already masked to 0x7F; the shipped threshold is 0, the render-state default): the interval is in
# r11 (bits 8..11 after `rlwinm r11,r11,8,0,23`) and `or r11,r10,r11` at 0x82419AC8 builds the swap-
# callback argument (interval << 8) | threshold, so writing r10 = 100 here changes only the callback's
# copy, never [dev+11852] or its getter. The callback sub_82419818 (CP thread) holds a late frame back
# one vblank when the percentage into the vblank period r7 (clamped to 100) is above the threshold;
# with 100 a late frame is released at once and an on-time frame still waits for the real 60 Hz vblank
# (scratch W4.4 REPORT option (b), docs/PLAN.md section 6 M5). Not a branch target (the label is
# 0x82419AB4); every interval arm passes through it. A5 (0x82419AA0, the interval-2 arm) runs just
# before, on the same presenting thread, and publishes the "timed swap" flag this hook consumes (clear
# on the arms without A5), so untimed swaps keep the shipped threshold.
# mcla/hooks/mcla_t_present_immediate.cpp, flag MCLA_HOOK_SIM_PRESENT_IMMEDIATE, cvar
# mcla_present_immediate (0 = untouched). NEEDS A RE-CODEGEN (new entry).
[[midasm_hook]]
address = 0x82419AC0
name = "mcla_hook_present_immediate"
registers = ["r10"]
after_instruction = true

# [A6b] mcla_t_swap_census (same file as A6a): AFTER `stw r11,16556(r31)` (word 917F40AC) in the swap
# callback sub_82419818, the store of the swap target [dev+16556]; CP thread, under the spinlock
# [dev+16712]. READ-ONLY census: it counts and never writes (a store changes no register, so the values
# are the same before and after). The registers, all as the callback has just computed them:
#   r7  = percentage into the current vblank period, 1..100: (mftb - [dev+16552]) * 100 / (freq / Hz) + 1
#   r8  = the previous swap's target, [dev+16556] as it was before this store
#   r10 = the vblank counter [dev+16548] (reloaded by the `lwz` just before the store)
#   r11 = the new swap target: r8 + r30 on time, else r10, plus 1 when held to the next vblank
#   r27 = the threshold the callback was given (argument bits 0..7): the value A6a leaves in r10
#   r30 = the interval (argument bits 8..11): vblanks per swap
# Classes (32-bit unsigned compares, as the guest's own `cmplw`): on time when r8 + r30 > r10; else
# late, released at once when r11 == r10 (interval 0 too), late, held to the next vblank when
# r11 == r10 + 1 (that is r7 > r27). r7 and r8 survive to here because the callback slot [dev+16540]
# (the only call in between) is never set. mcla/hooks/mcla_t_present_immediate.cpp, flag
# MCLA_HOOK_SIM_PRESENT_IMMEDIATE. NEEDS A RE-CODEGEN (new entry).
[[midasm_hook]]
address = 0x82419920
name = "mcla_hook_swap_census"
registers = ["r7", "r8", "r10", "r11", "r27", "r30"]
after_instruction = true

# [A7a] mcla_input_title_latch (W5.6): sub_82614D30, the per-pad update (sub_82615154 calls it once per game
# update for pads 0..3, record 0x82905388 + 64 n), BEFORE `lbz r11,46(r31)` at the join where the d-pad
# branches meet (a label: the branch at 0x82615038 lands here). r31 = the pad record: +8 = the new button
# mask, +12 = the previous update's (sub_8260B668 copies +8 to +12 and clears +8 at the head, the branches
# above OR the new bits into +8). The early return at 0x82614D70 (the query at 0x82614D5C answered nonzero) skips it. Read only.
# mcla/hooks/mcla_input_title_latch.cpp, flag MCLA_HOOK_INPUT_TITLE_LATCH, cvar mcla_input_title_latch.
# NEEDS A RE-CODEGEN (new entry).
[[midasm_hook]]
address = 0x82615048
name = "mcla_hook_input_pad_update"
registers = ["r31"]

# [A7b] mcla_input_title_latch: sub_822C8AF8 (IS_PAD_BUTTON_DOWN(pad, button), a gap function the codegen
# finds itself), BEFORE `cntlzw r6,r8` (0x822C8B30 `and r8,r9,r3` just made r8 = (prev ^ new) & (1 << button) &
# new, the press; `rlwinm r5,r6,27,31,31 ; xori ; stw` turn it into the answer). r8 = the press (the hook may
# set it), r6 = the pad (script argument 0), r5 = the button (argument 1); r6 and r5 are overwritten
# right after. mcla/hooks/mcla_input_title_latch.cpp (same flag and cvar as A7a). NEEDS A RE-CODEGEN
# (new entry).
[[midasm_hook]]
address = 0x822C8B34
name = "mcla_hook_input_pad_poll"
registers = ["r8", "r6", "r5"]

# [A7c] mcla_input_menu_repeat (W5.6): sub_82223CD8, the UI input object's update, loop over the 24 menu
# inputs (r31 = 0..23), the press branch (down now, not before), BEFORE `stbx r27,r31,r28` (threshold[r31] = 7;
# `stbx r21,r31,r29` count = 0 and the key-down call follow). r31 = the input. Read only: records the
# time of the key down. mcla/hooks/mcla_input_menu_repeat.cpp, flag MCLA_HOOK_INPUT_MENU_REPEAT, cvar
# mcla_input_menu_repeat. NEEDS A RE-CODEGEN (new entry).
[[midasm_hook]]
address = 0x822240C0
name = "mcla_hook_input_key_press"
registers = ["r31"]

# [A7d] mcla_input_menu_repeat: sub_82223CD8, the held branch (down now and before), BEFORE `stbx r8,r31,r29`
# (count[r31] = r8; `cmplw cr6,r10,r8 ; bne` follows and the repeat fires when they are equal). r8 = count + 1
# (`clrlwi r8,r9,24`), r10 = the threshold (`lbzx r10,r31,r28`), r31 = the input. The hook may lower r8 to
# r10 - 1: the stored count is one short, the compare fails and the next update asks again.
# mcla/hooks/mcla_input_menu_repeat.cpp (same flag and cvar as A7c). NEEDS A RE-CODEGEN (new entry).
[[midasm_hook]]
address = 0x822241CC
name = "mcla_hook_input_key_repeat"
registers = ["r8", "r10", "r31"]
